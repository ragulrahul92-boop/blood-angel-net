<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – LifeLink</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fa-solid fa-droplet"></i><span>LifeLink</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="search-donor.html">Find Donor</a>
        <a href="request.html">Request Blood</a>
        <a href="login.html">Login</a>
      </nav>
      <button class="nav-toggle"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card wide">
      <div class="auth-head">
        <div class="logo"><i class="fa-solid fa-droplet"></i><span>LifeLink</span></div>
        <h1>Create your account</h1>
        <p>Join the network and start saving lives</p>
      </div>

      <div class="alert error" id="alert"></div>
      <div class="alert success" id="success"></div>

      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" required placeholder="John Doe" />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone" required pattern="[0-9]{10}" placeholder="10-digit number" />
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Blood Group</label>
            <select id="bloodGroup" required>
              <option value="">Select</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>O+</option><option>O-</option>
              <option>AB+</option><option>AB-</option>
            </select>
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" required placeholder="Mumbai" />
          </div>
        </div>

        <label style="display:block;font-size:0.88rem;font-weight:500;margin-bottom:8px;">Register as</label>
        <div class="role-group" style="grid-template-columns: 1fr 1fr;">
          <div class="role-option">
            <input type="radio" name="role" value="donor" id="r-donor" checked />
            <label for="r-donor"><i class="fa-solid fa-hand-holding-droplet"></i>Donor</label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" value="patient" id="r-patient" />
            <label for="r-patient"><i class="fa-solid fa-user-injured"></i>Patient</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <p class="auth-foot">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const bloodGroup = document.getElementById('bloodGroup').value;
      const city = document.getElementById('city').value.trim();
      const role = document.querySelector('input[name="role"]:checked').value;
      const alertEl = document.getElementById('alert');
      const successEl = document.getElementById('success');

      const users = DB.get(LS_KEYS.USERS, []);
      if (users.find(u => u.email.toLowerCase() === email)) {
        alertEl.textContent = 'An account with this email already exists.';
        alertEl.className = 'alert error show';
        return;
      }

      const id = role[0] + Date.now();
      const profile = { id, name, phone, email, bloodGroup, city };
      if (role === 'donor') {
        profile.available = true;
        DB.push(LS_KEYS.DONORS, profile);
      } else {
        DB.push(LS_KEYS.PATIENTS, profile);
      }
      DB.push(LS_KEYS.USERS, { email, password, role, refId: id, name });

      alertEl.classList.remove('show');
      successEl.textContent = 'Account created! Redirecting to login…';
      successEl.className = 'alert success show';
      setTimeout(() => window.location.href = 'login.html', 1200);
    });
  </script>
</body>
</html>
