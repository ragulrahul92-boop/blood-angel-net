<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donor Dashboard – LifeLink</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fa-solid fa-droplet"></i><span>LifeLink</span></a>
      <nav class="nav-links">
        <a href="donor-dashboard.html" class="active">Dashboard</a>
        <a href="search-donor.html">Find Donor</a>
        <button id="logoutBtn" class="btn btn-outline btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </nav>
      <button class="nav-toggle"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <main class="dash-wrap">
    <div class="welcome-card">
      <div>
        <h2>Welcome, <span id="donorName">Donor</span> 👋</h2>
        <p>Thank you for being a lifesaver in your community.</p>
      </div>
      <div class="welcome-meta">
        <div class="blood-badge">
          <strong id="donorBlood">—</strong>
          <span>Blood Group</span>
        </div>
        <div class="blood-badge">
          <strong id="donorCity">—</strong>
          <span>City</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>Availability Status</h2>
          <p style="color:var(--muted);font-size:0.9rem;">Toggle off if you're unavailable to donate right now.</p>
        </div>
        <label class="toggle">
          <input type="checkbox" id="availToggle" />
          <span class="toggle-slider"></span>
          <span class="toggle-label" id="availLabel">Available</span>
        </label>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-inbox" style="color:var(--primary);margin-right:6px;"></i>Received Requests</h2>
      </div>
      <div id="requestList"></div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/donor.js"></script>
</body>
</html>
